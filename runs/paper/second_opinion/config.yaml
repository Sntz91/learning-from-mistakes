model:
  model: densenet
  binary: true
  pretrained: true
  params:
    drop_rate: 0.1
    dropout: 0.1
data:
  train:
  - dataset: rsna
    split: splits/rsna/no-match-sinoct-train.parquet
  val:
  - dataset: rsna
    split: splits/rsna/no-match-sinoct-val.parquet
  predict:
  - dataset: rsna
    split: splits/rsna/no-match-sinoct-val.parquet
    name: rsna-no-match-sinoct-val
  - dataset: rsna
    split: splits/rsna/no-match-sinoct-test.parquet
    name: rsna-no-match-sinoct-test
training:
  seed: 4242
  deterministic: true
  epochs: 100
  batch_size: 256
  patience: 7
  eval_metric: auroc
  num_workers: 16
  pin_memory: true
  persistent_workers: true
  device: cuda
  use_sample_weights: false
optimizer:
  lr: 5.0e-05
  lr_min: 1.0e-06
  weight_decay: 0.001
loss:
  name: focal
  use_pos_weights: false
  params:
    gamma: 2.0
